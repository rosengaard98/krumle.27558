<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krumle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lora', serif;
      background: #faf9f6;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container { text-align: center; max-width: 480px; width: 100%; }
    .sheep { font-size: 72px; display: block; margin-bottom: 1.25rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    h1 { font-size: 64px; font-weight: 600; letter-spacing: -2px; line-height: 1; margin-bottom: 6px; }
    .phonetic { font-family: 'Space Mono', monospace; font-size: 13px; color: #888780; letter-spacing: 1px; margin-bottom: 0.4rem; }
    .tagline { font-style: italic; font-size: 14px; color: #b4b2a9; margin-bottom: 0.6rem; }
    .pronunciation-prompt { font-size: 13px; color: #888780; margin-bottom: 2.5rem; }
    .pronunciation-prompt em { font-style: italic; }
    .buttons { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex; align-items: center; padding: 16px 24px;
      border: 1px solid #d3d1c7; border-radius: 12px; background: #fff;
      cursor: pointer; font-family: 'Lora', serif; font-size: 16px; color: #1a1a18;
      transition: background 0.15s, transform 0.1s, border-color 0.15s; text-align: left; gap: 14px;
    }
    .btn:hover { background: #f1efe8; border-color: #b4b2a9; }
    .btn:active { transform: scale(0.98); }
    .btn.playing { border-color: #1a1a18; background: #1a1a18; color: #faf9f6; }
    .btn-label { font-weight: 600; font-size: 15px; }
    .btn-desc { font-size: 13px; font-style: italic; color: #888780; margin-top: 2px; }
    .btn.playing .btn-desc { color: #b4b2a9; }
    .play-icon {
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid #d3d1c7;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .play-icon svg { width: 12px; height: 12px; fill: currentColor; margin-left: 2px; }
    .btn.playing .play-icon { border-color: #b4b2a9; }
    .btn.playing .play-icon svg { fill: #faf9f6; }
    .footer {
      margin-top: 3rem;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      text-decoration: none;
    }
    .footer svg { width: 22px; height: 22px; fill: none; stroke: #888780; stroke-width: 1.5; transition: stroke 0.15s; }
    .footer:hover svg { stroke: #1a1a18; }
    .footer span {
      font-family: 'Space Mono', monospace; font-size: 11px;
      color: #888780; letter-spacing: 1px; transition: color 0.15s;
    }
    .footer:hover span { color: #1a1a18; }
  </style>
</head>
<body>
  <div class="container">
    <span class="sheep">🐑</span>
    <h1>Krumle</h1>
    <p class="phonetic">[ ˈkʁɔml̩ə ]</p>
    <p class="tagline">Your friendly neighborhood lamb.</p>
    <p class="pronunciation-prompt">But how do you even pronounce <em>Krumle</em>?</p>

    <div class="buttons">
      <button class="btn" onclick="play(this, 'Normal.m4a')">
        <div class="play-icon"><svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg></div>
        <div><div class="btn-label">Normal version</div><div class="btn-desc">As you would say it with a neutral tone.</div></div>
      </button>
      <button class="btn" onclick="play(this, 'Hvor_er_Krumle.m4a')">
        <div class="play-icon"><svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg></div>
        <div><div class="btn-label">Where is Krumle?</div><div class="btn-desc">Krumle is gone! Where is Krumle?</div></div>
      </button>
      <button class="btn" onclick="play(this, 'Du_spotter_Krumle.m4a')">
        <div class="play-icon"><svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg></div>
        <div><div class="btn-label">Ah! There is Krumle.</div><div class="btn-desc">Your happiness can be heard in your voice.</div></div>
      </button>
      <button class="btn" onclick="play(this, 'dum_krumle.m4a')">
        <div class="play-icon"><svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg></div>
        <div><div class="btn-label">But now Krumle did something a bit silly.</div><div class="btn-desc">But also a bit cute. You can't be mad at a lamb, can you?</div></div>
      </button>
      <button class="btn" onclick="play(this, 'Nu_er_du_sur.m4a')">
        <div class="play-icon"><svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg></div>
        <div><div class="btn-label">Okay, you ARE mad at Krumle the lamb now!</div><div class="btn-desc">What Krumle did WAS a bit too much.</div></div>
      </button>
    </div>

    <a class="footer" href="https://www.instagram.com/krumle.27558" target="_blank">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.5" fill="#888780" stroke="none"/>
      </svg>
      <span>FOLLOW KRUMLE ON INSTAGRAM</span>
    </a>
  </div>

  <script>
    let current = null, currentBtn = null;
    function play(btn, file) {
      if (current) {
        current.pause(); current.currentTime = 0;
        if (currentBtn) currentBtn.classList.remove('playing');
        if (currentBtn === btn) { current = null; currentBtn = null; return; }
      }
      const audio = new Audio(file);
      audio.play();
      btn.classList.add('playing');
      current = audio; currentBtn = btn;
      audio.onended = () => { btn.classList.remove('playing'); current = null; currentBtn = null; };
    }
  </script>
</body>
</html>
